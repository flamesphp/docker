# ─── Memory Policy ────────────────────────────────────────────────────────────
# maxmemory is set via .env (see kvrocks.yml command)

# ─── Performance ──────────────────────────────────────────────────────────────
workers 4

# ─── Network ──────────────────────────────────────────────────────────────────
port 6666
tcp-backlog 511

# ─── Storage ──────────────────────────────────────────────────────────────────
dir /var/lib/kvrocks

# ─── Slow log ─────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
